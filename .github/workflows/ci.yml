name: CI - Safe NL-to-SQL Assistant

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    env:
      APP_NAME: Safe NL-to-SQL Analytics Assistant
      APP_VERSION: 1.0.0
      APP_ENV: testing

      FLASK_HOST: 127.0.0.1
      FLASK_PORT: 5000
      FLASK_DEBUG: False

      OPENAI_API_KEY: dummy-test-key
      OPENAI_MODEL: gpt-5-mini

      DATABASE_PATH: data/test_safe_analytics.db

      MAX_QUERY_ROWS: 100
      MAX_QUERY_SECONDS: 5

      ENABLE_MUTEX: False
      APP_MUTEX_NAME: safe_nl_to_sql_analytics_assistant_test

      ENABLE_API_KEY_AUTH: False
      APP_API_KEY: local-demo-key

      ENABLE_RATE_LIMITING: False
      RATE_LIMIT_STORAGE_URI: memory://
      RATE_LIMIT_DEFAULT: 100 per hour
      RATE_LIMIT_QUERY: 30 per minute

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create runtime folders
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest